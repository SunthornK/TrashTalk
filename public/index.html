<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chores · Trash Talk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗑️</text></svg>">
  <link rel="stylesheet" href="/vendor/pico.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/chores/main.js"></script>
</head>
<body>
  <header class="topbar container">
    <a class="logo" href="/">Trash Talk</a>
    <nav id="nav" hidden aria-label="Main">
      <a href="/" aria-current="page">Chores</a>
      <a href="/household.html">Household</a>
    </nav>
    <div class="who" id="who"></div>
  </header>

  <div class="container">
    <section id="requests" aria-label="Requests for you"></section>
    <div id="controls" class="controls" hidden>
      <label>Show
        <select id="filter">
          <option value="everyone">Everyone</option>
          <option value="mine">Just me</option>
          <option value="waiting">Waiting on someone</option>
        </select>
      </label>
      <label>Sort
        <select id="sort">
          <option value="due">Due date</option>
          <option value="name">Chore name</option>
        </select>
      </label>
    </div>
    <main id="content">
      <p aria-busy="true">Loading…</p>
    </main>
  </div>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
